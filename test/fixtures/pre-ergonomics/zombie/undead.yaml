statuses:
  # The undead notice a survivor in plain sight and lose track of them only
  # once they are well out of view.
  - id: alert
    label: Alert
    for: 'self.has_tag("undead")'
    when: 'can_see(self, player, 8)'
    until: 'not can_see(self, player, 12)'
    hud: { tone: bad, description: A zombie has seen you }

# The undead shuffle around where they rose, chase a survivor they can see,
# shuffle over to any noise they hear (the town's broken glass, alarm clocks
# and hammering), and linger a while where they lost track before wandering
# off again. Sight beats sound.
behaviors:
  - id: shambler
    initial: wander
    states:
      wander:
        do: wander
        radius: 6
        on:
          - { when: 'self.has_status("alert")', to: chase }
          - { when: 'heard(self, 1)', to: investigate }
      investigate:
        do: investigate
        on:
          - { when: 'self.has_status("alert")', to: chase }
        done: search
      chase:
        do: pursue
        target: player
        on:
          - { when: 'not self.has_status("alert")', to: search }
      search:
        do: idle
        on:
          - { when: 'self.has_status("alert")', to: chase }
          - { when: 'heard(self, 1)', to: investigate }
        timeout: { after: 5, to: wander }
