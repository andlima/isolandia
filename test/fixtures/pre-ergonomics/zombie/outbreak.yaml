# The outbreak, as overrides of the `town` base game (docs/packs.md#mods-and-overrides):
# the dead fill the town and the resident becomes a survivor with a way out.

maps:
  # The old town block: a few of the dead already inside the houses.
  - id: town:town_center
    override: true
    spawns:
      - { archetype: shambler, at: [29, 4] }
      - { archetype: crawler, at: [4, 8] }
      - { archetype: shambler, at: [20, 13] }
      - { archetype: crawler, at: [48, 20] }
      - { archetype: shambler, at: [31, 23] }
      - { archetype: shambler, at: [52, 5, 1] }    # upstairs, north-east house
  # Something still lies upstairs in every one of these.
  - id: town:house_c
    override: true
    populate:
      - { archetype: crawler, count: 1, floor: 1, room: bedroom }
  - id: town:city
    override: true
    # Three nested regions of the 343×343 city, in composite coordinates
    # (the base city has no rooms of its own): `town` is the 5×5 grid of
    # blocks and the roads between them, `downtown` the 3×3 around the old
    # town block, `center` that block itself (left to its spawns above).
    rooms:
      - { rect: [9, 9, 325, 325], tags: [town] }
      - { rect: [73, 73, 197, 197], tags: [downtown] }
      - { rect: [137, 137, 69, 69], tags: [center] }
    # Density is entities per 100 candidate cells (walkable, no furniture,
    # floor 0); `npm run check -- zombie --populate` lists the cells and the
    # counts (about 895 in all: 400 + 50 downtown, 397 in the suburbs, 48 in
    # the fields).
    populate:
      # Downtown: 1.2 per 100 of its ~33 300 cells, twice the suburbs.
      - { archetype: shambler, density: 1.2, where: 'tile.in_room("downtown") and not tile.in_room("center")' }
      # One crawler for every eight shamblers downtown.
      - { archetype: crawler, density: 0.15, where: 'tile.in_room("downtown") and not tile.in_room("center")' }
      # The suburbs: 0.6 per 100 of the ~66 200 cells of the outer 16 blocks.
      - { archetype: shambler, density: 0.6, where: 'tile.in_room("town") and not tile.in_room("downtown")' }
      # The fields around the town: 0.4 per 100 of ~12 000 grass cells.
      - { archetype: shambler, density: 0.4, where: 'not tile.in_room("town")' }

archetypes:
  - id: town:resident
    override: true
    label: Survivor

start:
  override: true
  defeat:
    when: "self.hp <= 0"
    message: "You did not survive the outbreak."
  # A car battery from a garage gets one of the wrecks running: the `escape`
  # quest (escape.yaml) tracks it, and its success is the win.
  victory:
    when: 'quest_succeeded("escape")'
    message: "You got the car running!"
