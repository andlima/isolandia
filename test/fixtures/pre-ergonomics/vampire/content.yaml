measurements:
  - id: blood
    label: Blood
    min: 0
    # Blood capacity is tied to health: half of current hp, at least 10.
    max: "max(10, self.std:hp / 2)"
    initial: 50
    # Drains 0.05 per second at night, 0.1 in daylight.
    rate: "-0.05 - 0.05 * world.is_day"
    hud: { bad: low }

tiles:
  # The windows are the town's (`town:window`), in the mansion's colours.
  - id: town:window
    override: true
    color: "#6fa8dc"
    sprite: window_img
  - id: carpet
    label: Carpet
    glyph: "."
    color: "#8b1e2d"
    walkable: true
    sprite: carpet_img
  # Creaks under the undead's weight: a `creak` system makes noise
  # (survival.yaml).
  - id: creaky
    label: Creaky floorboards
    glyph: ","
    color: "#6b2a30"
    sprite: creaky_img
    walkable: true
    tags: [creaky]
  - id: sunbeam
    label: Sunlit floor
    glyph: "'"
    color: "#e8d27a"
    sprite: sunbeam_img
    walkable: true
    exposed: true
  - id: crypt
    label: Crypt floor
    glyph: "_"
    color: "#3b3346"
    sprite: crypt_img
    walkable: true
    tags: [crypt]
  - id: font
    label: Blood font
    glyph: "u"
    color: "#c0182c"
    sprite: font_img
    walkable: true
    tags: [blood]
  - id: coffin
    label: Coffin
    glyph: "="
    color: "#4a3426"
    walkable: false
    opaque: false                   # low: blocks the way, not the view
    sprite: coffin_img
  # The town's window after the `shutter` action (survival.yaml): no light, no view.
  - id: shuttered_window
    label: Shuttered window
    glyph: "|"
    color: "#8a6a3a"
    sprite: shuttered_window_img
    walkable: false
    opaque: true
    edge: true                      # in the walls, like the window it shutters
  - id: bookshelf
    label: Bookshelf
    glyph: "L"
    color: "#6a4a2a"
    sprite: bookshelf_img
    walkable: false
    container: { capacity: 20 }
  # A steep ladder up to the attic: links its cell to the one above (docs/packs.md#floors).
  - id: ladder
    label: Ladder
    glyph: "<"
    color: "#b08850"
    sprite: ladder_img
    walkable: true
    raised: true
    opaque: false
    climb: up
  - id: chest
    label: Oak chest
    glyph: "X"
    color: "#8a6a3a"
    sprite: chest_img
    walkable: false
    opaque: false                   # low: blocks the way, not the view
    container: { capacity: 30 }
  - id: wine_rack
    label: Wine rack
    glyph: "R"
    color: "#5a1a2a"
    sprite: wine_rack_img
    walkable: false
    container: { capacity: 8 }

archetypes:
  - id: vampire
    label: Vampire
    glyph: V
    color: "#e0e0ff"
    sprite: vampire_img
    tags: [humanoid, undead]
    measurements: [hp, blood]
    ticks_per_step: 1
    inventory:
      capacity: 8
      items: { blood_vial: 1 }
  - id: bat
    label: Bat
    glyph: b
    color: "#7a5c8a"
    sprite: bat_img
    tags: [beast]
    measurements: [hp]
    initial: { hp: 5 }
    senses: { sight: { notice: 6, lose: 10, targets: [undead] } }
    behavior: bat

# The night begins as the game does: it starts at dusk.
clock:
  override: true
  start: "20:00"

# The town's start, moved to the estate: the vampire plays there, under the
# town's day and simulation settings.
start:
  override: true
  map: estate
  player: vampire
  defeat:
    when: "self.hp <= 0"
    message: "Your unlife has ended."
