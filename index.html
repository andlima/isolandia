<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>isolandia</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1d22; }
      canvas { display: block; }
      #hud {
        position: fixed; top: 8px; left: 8px; margin: 0; padding: 6px 8px;
        font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; color: #e8e8e8;
        background: rgba(0, 0, 0, 0.6); border-radius: 4px; pointer-events: none;
      }
      #perf {
        position: fixed; bottom: 8px; left: 8px; padding: 3px 6px;
        font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; color: #b8f0b8;
        background: rgba(0, 0, 0, 0.6); border-radius: 4px; pointer-events: none;
      }
      #perf[hidden] { display: none; }
      #defeat, #victory {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 16px 28px;
        font: bold 22px/1.4 ui-monospace, Menlo, Consolas, monospace; color: #ff8a8a; text-align: center;
        background: rgba(0, 0, 0, 0.75); border-radius: 6px; pointer-events: none;
      }
      #victory { color: #ffe27a; background: rgba(40, 90, 60, 0.85); border: 2px solid #ffe27a; }
      #defeat[hidden], #victory[hidden] { display: none; }
      #activity {
        position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); width: 240px; height: 18px;
        background: rgba(0, 0, 0, 0.7); border: 1px solid #556; border-radius: 4px; overflow: hidden; pointer-events: none;
      }
      #activity[hidden] { display: none; }
      #activity .activity-fill { height: 100%; width: 0; background: #4a8a4a; }
      #activity .activity-label {
        position: absolute; inset: 0; text-align: center;
        font: 12px/18px ui-monospace, Menlo, Consolas, monospace; color: #e8e8e8;
      }
      .panel {
        position: fixed; right: 8px; max-width: 340px; max-height: 45vh; overflow: auto; padding: 6px 8px;
        font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; color: #e8e8e8;
        background: rgba(0, 0, 0, 0.7); border-radius: 4px;
      }
      .panel[hidden] { display: none; }
      #inventory { top: 8px; }
      #loot { bottom: 8px; }
      #crafting { left: 8px; right: auto; bottom: 40px; }
      .panel-subtitle { color: #c9a25a; margin-top: 4px; }
      .panel-hint { font-size: 11px; color: #c9a25a; }
      #craft-toggle {
        position: fixed; left: 8px; bottom: 8px; font: 12px ui-monospace, Menlo, Consolas, monospace; color: #e8e8e8;
        background: #333a44; border: 1px solid #556; border-radius: 3px; padding: 2px 8px; cursor: pointer;
      }
      #game { top: 50%; left: 50%; right: auto; transform: translate(-50%, -50%); z-index: 5; min-width: 300px; max-height: 80vh; }
      #game .panel-row { margin: 4px 0; }
      #game .panel-subtitle { display: block; margin-top: 0; }
      #game .file-button {
        font-size: 12px; background: #333a44; border: 1px solid #556; border-radius: 3px; padding: 0 5px; cursor: pointer;
      }
      #game .file-button input { display: none; }
      #game .game-errors { margin: 4px 0; padding-left: 18px; color: #ff8a8a; font-size: 12px; }
      #game-toggle {
        position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%); font: 12px ui-monospace, Menlo, Consolas, monospace;
        color: #e8e8e8; background: #333a44; border: 1px solid #556; border-radius: 3px; padding: 2px 8px; cursor: pointer;
      }
      #game-note {
        position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 6; max-width: min(480px, 90vw); padding: 6px 28px 6px 10px;
        font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; color: #e8e8e8; background: rgba(0, 0, 0, 0.8); border: 1px solid #556; border-radius: 4px;
      }
      #game-note[hidden] { display: none; }
      #game-note .note-close {
        position: absolute; top: 2px; right: 4px; font: inherit; color: #e8e8e8; background: transparent; border: 0; cursor: pointer;
      }
      .panel-title { font-weight: bold; color: #ffd23f; margin-top: 4px; }
      .panel button {
        font: inherit; font-size: 12px; color: #e8e8e8; background: #333a44; border: 1px solid #556;
        border-radius: 3px; padding: 0 5px; margin: 1px 0; cursor: pointer;
      }
      .panel button:disabled { opacity: 0.4; cursor: default; }
      .panel-title.focus { animation: focus 1s ease-out; }
      @keyframes focus { from { background: rgba(255, 210, 63, 0.4); } to { background: transparent; } }
      #menu {
        right: auto; z-index: 10; min-width: 160px; max-width: min(300px, calc(100vw - 8px)); max-height: calc(100vh - 8px);
        box-sizing: border-box; padding: 4px; background: rgba(15, 17, 22, 0.94); border: 1px solid #556;
      }
      #menu .panel-title { margin: 0 4px 4px; }
      #menu .menu-item {
        display: block; width: 100%; text-align: left; font-size: 13px; padding: 4px 8px; margin: 0;
        background: transparent; border: 1px solid transparent;
      }
      #menu .menu-item.selected { background: #333a44; border-color: #556; }
      #menu .menu-item.disabled { color: #8a8f99; cursor: default; }
      #menu .menu-hint { display: block; font-size: 11px; color: #c9a25a; }
      #errors {
        margin: 0; padding: 16px; height: 100%; box-sizing: border-box; overflow: auto;
        font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; color: #ff8a8a; white-space: pre-wrap;
      }
      #errors a { color: #8ab4ff; }
      #picker {
        max-width: 640px; margin: 0 auto; padding: 24px 16px; height: 100%; box-sizing: border-box; overflow: auto;
        font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; color: #e8e8e8;
      }
      #picker h1 { margin: 0 0 16px; font-size: 22px; color: #ffd23f; }
      #picker .picker-row {
        display: block; width: 100%; text-align: left; margin: 6px 0; padding: 8px 10px; font: inherit; color: inherit;
        background: #262a31; border: 1px solid #3a404b; border-radius: 4px; cursor: pointer;
      }
      #picker .picker-row.chosen { border-color: #ffd23f; background: #333a44; }
      #picker .picker-row:disabled { opacity: 0.5; cursor: default; }
      #picker .picker-name { font-weight: bold; color: #ffd23f; }
      #picker .picker-kind, #picker .picker-stack, #picker .picker-hint { font-size: 11px; color: #c9a25a; }
      #picker .picker-subtitle { margin-top: 12px; color: #c9a25a; }
      #picker .picker-mod { display: block; margin: 4px 0; cursor: pointer; }
      #picker .picker-mod.disabled { opacity: 0.5; cursor: default; }
      #picker .picker-desc { font-size: 12px; color: #b8bcc4; }
      #picker .picker-errors { color: #ff8a8a; padding-left: 18px; }
      #picker .picker-footer { margin-top: 16px; }
      #picker input[type=number] { width: 80px; font: inherit; }
      #picker button#picker-play { font: inherit; padding: 2px 16px; cursor: pointer; }
    </style>
  </head>
  <body>
    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
