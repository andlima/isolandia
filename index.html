<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>isolandia</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1d22; }
      canvas { display: block; }
      #hud {
        position: fixed; top: 8px; left: 8px; box-sizing: border-box; width: 240px; max-width: calc(100vw - 120px);
        max-height: calc(50vh - 16px); overflow: hidden; padding: 6px 8px; display: flex; flex-direction: column; gap: 3px;
        font: 12px/1.35 ui-monospace, Menlo, Consolas, monospace; color: #e8e8e8;
        background: rgba(12, 14, 20, 0.62); border: 1px solid rgba(120, 130, 150, 0.25); border-radius: 6px; pointer-events: none;
      }
      #hud[hidden] { display: none; }
      #hud .hud-card { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: bold; margin-bottom: 2px; }
      #hud .hud-icon { width: 16px; text-align: center; }
      #hud .hud-sun { color: #ffd23f; }
      #hud .hud-moon { color: #a8c0ff; }
      #hud .hud-floor {
        margin-left: auto; padding: 0 6px; font-size: 11px; font-weight: normal; color: #c9d2e3;
        background: #333a44; border: 1px solid #556; border-radius: 8px;
      }
      #hud .hud-row { display: flex; align-items: center; gap: 6px; }
      #hud .hud-label { flex: none; width: 62px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #hud .hud-label-abbr { display: none; }
      #hud .hud-carry .hud-label { width: auto; flex: 1 1 auto; min-width: 0; }
      #hud .hud-bar { flex: 1 1 auto; min-width: 30px; height: 8px; background: #262b35; border: 1px solid #454c5a; border-radius: 4px; overflow: hidden; }
      #hud .hud-bar-none { visibility: hidden; }
      #hud .hud-carry .hud-bar { flex: 0 0 90px; }
      #hud .hud-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
      #hud .hud-ok { background: #5fbf5f; }
      #hud .hud-warn { background: #e0a030; }
      #hud .hud-danger { background: #e0503f; }
      #hud .hud-neutral { background: #7d8fb0; }
      #hud .hud-value { flex: none; min-width: 52px; text-align: right; color: #c9d2e3; }
      #hud .hud-pulse .hud-bar { animation: hud-pulse 1.4s ease-in-out infinite; }
      @keyframes hud-pulse { 50% { box-shadow: 0 0 6px 1px rgba(224, 80, 63, 0.75); opacity: 0.75; } }
      @media (prefers-reduced-motion: reduce) {
        #hud .hud-pulse .hud-bar { animation: none; }
        #hud .hud-fill { transition: none; }
      }
      #hud .hud-chips { display: flex; flex-wrap: wrap; gap: 3px; margin: 2px 0; }
      #hud .hud-chip {
        pointer-events: auto; cursor: default; padding: 0 6px; font-size: 11px; line-height: 16px; border-radius: 8px; border: 1px solid;
      }
      #hud .hud-tone-bad { color: #ffd6d0; background: #6a2a24; border-color: #e0503f; }
      #hud .hud-tone-good { color: #d6ffd6; background: #24502a; border-color: #5fbf5f; }
      #hud .hud-tone-neutral { color: #e0e4ec; background: #3a404c; border-color: #6a7385; }
      #hud .hud-nearby { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #hud .hud-nearby { color: #9aa2b1; font-size: 11px; }
      #hud-tip {
        position: fixed; z-index: 8; max-width: 240px; padding: 4px 8px; pointer-events: none;
        font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; color: #e8e8e8;
        background: rgba(0, 0, 0, 0.88); border: 1px solid #556; border-radius: 4px;
      }
      #hud-tip[hidden] { display: none; }
      #hud-tip .hud-tip-title { font-weight: bold; color: #ffd23f; }
      @media (max-width: 560px) {
        #hud { width: 170px; padding: 4px 6px; gap: 2px; }
        #hud .hud-label { width: 28px; }
        #hud .hud-label-full { display: none; }
        #hud .hud-label-abbr { display: inline; }
        #hud .hud-value { min-width: 44px; font-size: 11px; }
        #hud .hud-carry .hud-bar { flex-basis: 50px; }
      }
      #perf {
        position: fixed; bottom: 8px; left: 8px; padding: 3px 6px;
        font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; color: #b8f0b8;
        background: rgba(0, 0, 0, 0.6); border-radius: 4px; pointer-events: none;
      }
      #perf[hidden] { display: none; }
      #defeat, #victory {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 16px 28px;
        font: bold 22px/1.4 ui-monospace, Menlo, Consolas, monospace; color: #ff8a8a; text-align: center;
        background: rgba(0, 0, 0, 0.75); border-radius: 6px; pointer-events: none;
      }
      #victory { color: #ffe27a; background: rgba(40, 90, 60, 0.85); border: 2px solid #ffe27a; }
      #defeat[hidden], #victory[hidden] { display: none; }
      #activity {
        position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); width: 240px; height: 18px;
        background: rgba(0, 0, 0, 0.7); border: 1px solid #556; border-radius: 4px; overflow: hidden; pointer-events: none;
      }
      #activity[hidden] { display: none; }
      #activity .activity-fill { height: 100%; width: 0; background: #4a8a4a; }
      #activity .activity-label {
        position: absolute; inset: 0; text-align: center;
        font: 12px/18px ui-monospace, Menlo, Consolas, monospace; color: #e8e8e8;
      }
      .panel {
        position: fixed; right: 8px; max-width: 340px; max-height: 45vh; overflow: auto; padding: 6px 8px;
        font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; color: #e8e8e8;
        background: rgba(0, 0, 0, 0.7); border-radius: 4px;
      }
      .panel[hidden] { display: none; }
      #transfer {
        bottom: 8px; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;
        width: min(560px, calc(100vw - 16px)); max-width: none; max-height: calc(50vh - 48px); padding: 4px 6px;
      }
      #transfer[hidden] { display: none; }
      #transfer .transfer-head { display: flex; align-items: flex-start; gap: 4px; flex: none; }
      #transfer .transfer-head .panel-title { flex: 1; margin: 0; }
      #transfer .transfer-tabs { flex: 1; display: flex; flex-wrap: wrap; gap: 2px; }
      #transfer .transfer-tab.selected { background: #5a4a1e; border-color: #ffd23f; color: #ffd23f; }
      #transfer .transfer-close { margin-left: auto; padding: 0 7px; }
      #transfer .transfer-panes { display: flex; gap: 8px; flex: 1; min-height: 0; margin-top: 4px; }
      #transfer .transfer-pane { flex: 1 1 0; min-width: 0; overflow: auto; }
      #transfer .transfer-pane-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px; }
      #transfer .transfer-pane-head .panel-title { margin: 0; }
      #transfer .transfer-pane-head button { margin-left: auto; }
      #transfer .transfer-dim { font-size: 11px; color: #a8adb7; }
      #transfer .transfer-bar { position: relative; height: 14px; margin: 3px 0; background: #222630; border: 1px solid #556; border-radius: 3px; overflow: hidden; }
      #transfer .transfer-fill { height: 100%; background: #4a7a4a; }
      #transfer .transfer-fill.full { background: #8a4a3a; }
      #transfer .transfer-bar-text { position: absolute; inset: 0; text-align: center; font-size: 11px; line-height: 14px; }
      #transfer .transfer-message { font-size: 12px; color: #ff8a8a; }
      #transfer .transfer-empty { color: #8a8f99; }
      #transfer .transfer-item { display: flex; align-items: center; gap: 3px; }
      #transfer .transfer-row {
        flex: 1; min-width: 0; display: flex; align-items: center; gap: 5px; text-align: left; font-size: 13px;
        padding: 1px 4px; background: transparent; border-color: transparent;
      }
      #transfer .transfer-row:hover:not(:disabled):not(.inert), #transfer .transfer-row:focus-visible { background: #333a44; border-color: #556; }
      #transfer .transfer-row.inert { cursor: default; }
      #transfer .transfer-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #transfer .transfer-count { color: #ffd23f; }
      #transfer .transfer-icon {
        flex: none; width: 24px; height: 24px; object-fit: contain; image-rendering: pixelated;
        display: inline-flex; align-items: center; justify-content: center; border-radius: 3px;
        font-size: 14px; font-weight: bold; color: #111; text-shadow: 0 0 2px rgba(255, 255, 255, 0.6);
      }
      @media (max-width: 560px) {
        #transfer .transfer-panes { flex-direction: column; }
      }
      #crafting { left: 8px; right: auto; bottom: 40px; }
      #journal { top: 36px; right: 8px; max-width: 380px; }
      #journal-toggle {
        position: fixed; top: 8px; right: 8px; font: 12px ui-monospace, Menlo, Consolas, monospace; color: #e8e8e8;
        background: #333a44; border: 1px solid #556; border-radius: 3px; padding: 2px 8px; cursor: pointer;
      }
      #journal-toast {
        position: fixed; top: 44px; left: 50%; transform: translateX(-50%); max-width: min(560px, 90vw); padding: 4px 10px;
        font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; color: #ffe9a8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        background: rgba(0, 0, 0, 0.75); border: 1px solid #c9a25a; border-radius: 4px; pointer-events: none;
      }
      #journal-toast[hidden] { display: none; }
      #log-strip {
        position: fixed; left: 8px; bottom: 36px; max-width: min(480px, calc(100vw - 16px)); pointer-events: none;
        font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; color: #e8e8e8;
      }
      #log-strip[hidden] { display: none; }
      #log-strip .log-line {
        width: fit-content; max-width: 100%; margin-top: 2px; padding: 0 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        background: rgba(0, 0, 0, 0.6); border-radius: 3px; transition: opacity 1s linear;
      }
      #log-strip .log-line.log-faded { opacity: 0; }
      .log-good { color: #8fe08f; }
      .log-bad { color: #ff8a8a; }
      #log {
        left: 50%; right: auto; bottom: 64px; transform: translateX(-50%); z-index: 4; box-sizing: border-box;
        display: flex; flex-direction: column; width: min(520px, calc(100vw - 16px)); max-width: none; max-height: 50vh; overflow: hidden;
      }
      #log[hidden] { display: none; }
      #log .log-head { display: flex; align-items: flex-start; flex: none; }
      #log .log-head .panel-title { flex: 1; margin: 0; }
      #log .log-close { padding: 0 7px; }
      #log .log-list { flex: 1; min-height: 0; overflow: auto; margin-top: 4px; }
      #log .log-row { white-space: pre-wrap; }
      #log-toggle {
        position: fixed; right: calc(50% + 46px); bottom: 8px; font: 12px ui-monospace, Menlo, Consolas, monospace;
        color: #e8e8e8; background: #333a44; border: 1px solid #556; border-radius: 3px; padding: 2px 8px; cursor: pointer;
      }
      .standing-bar { position: relative; height: 4px; margin: 1px 0 4px; background: #333a44; border-radius: 2px; }
      .standing-bar::after { content: ''; position: absolute; left: 50%; top: -1px; width: 1px; height: 6px; background: #889; }
      .standing-fill { position: absolute; top: 0; height: 100%; background: #7fbf7f; border-radius: 2px; }
      .standing-fill.standing-low { background: #d0605a; }
      .tooltip-danger { color: #ff6b5e; }
      .panel-subtitle { color: #c9a25a; margin-top: 4px; }
      .panel-hint { font-size: 11px; color: #c9a25a; }
      #craft-toggle {
        position: fixed; left: 8px; bottom: 8px; font: 12px ui-monospace, Menlo, Consolas, monospace; color: #e8e8e8;
        background: #333a44; border: 1px solid #556; border-radius: 3px; padding: 2px 8px; cursor: pointer;
      }
      #game { top: 50%; left: 50%; right: auto; transform: translate(-50%, -50%); z-index: 5; min-width: 300px; max-height: 80vh; }
      #game .panel-row { margin: 4px 0; }
      #game .panel-subtitle { display: block; margin-top: 0; }
      #game .file-button {
        font-size: 12px; background: #333a44; border: 1px solid #556; border-radius: 3px; padding: 0 5px; cursor: pointer;
      }
      #game .file-button input { display: none; }
      #game .game-errors { margin: 4px 0; padding-left: 18px; color: #ff8a8a; font-size: 12px; }
      #game-toggle {
        position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%); font: 12px ui-monospace, Menlo, Consolas, monospace;
        color: #e8e8e8; background: #333a44; border: 1px solid #556; border-radius: 3px; padding: 2px 8px; cursor: pointer;
      }
      #game-note {
        position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 6; max-width: min(480px, 90vw); padding: 6px 28px 6px 10px;
        font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; color: #e8e8e8; background: rgba(0, 0, 0, 0.8); border: 1px solid #556; border-radius: 4px;
      }
      #game-note[hidden] { display: none; }
      #game-note .note-close {
        position: absolute; top: 2px; right: 4px; font: inherit; color: #e8e8e8; background: transparent; border: 0; cursor: pointer;
      }
      .panel-title { font-weight: bold; color: #ffd23f; margin-top: 4px; }
      .panel button {
        font: inherit; font-size: 12px; color: #e8e8e8; background: #333a44; border: 1px solid #556;
        border-radius: 3px; padding: 0 5px; margin: 1px 0; cursor: pointer;
      }
      .panel button:disabled { opacity: 0.4; cursor: default; }
      #menu {
        right: auto; z-index: 10; min-width: 160px; max-width: min(300px, calc(100vw - 8px)); max-height: calc(100vh - 8px);
        box-sizing: border-box; padding: 4px; background: rgba(15, 17, 22, 0.94); border: 1px solid #556;
      }
      #menu .panel-title { margin: 0 4px 4px; }
      #menu .menu-item {
        display: block; width: 100%; text-align: left; font-size: 13px; padding: 4px 8px; margin: 0;
        background: transparent; border: 1px solid transparent;
      }
      #menu .menu-item.selected { background: #333a44; border-color: #556; }
      #menu .menu-item.disabled { color: #8a8f99; cursor: default; }
      #menu .menu-hint { display: block; font-size: 11px; color: #c9a25a; }
      #menu .menu-key { display: inline-block; width: 1.4em; color: #8a8f99; }
      #menu .menu-click { margin-left: 6px; font-size: 11px; color: #8fd3ff; }
      #menu .menu-detail { font-size: 11px; color: #a8adb7; }
      #menu .menu-fold { color: #a8adb7; }
      #dialogue {
        top: auto; left: 50%; right: auto; bottom: 40px; transform: translateX(-50%); z-index: 4;
        width: min(640px, calc(100vw - 16px)); max-width: none; box-sizing: border-box; padding: 8px 10px; background: rgba(15, 17, 22, 0.94); border: 1px solid #556;
      }
      #dialogue .dialogue-text { margin: 4px 0 8px; font-size: 14px; white-space: pre-wrap; }
      #dialogue .dialogue-choice {
        display: block; width: 100%; text-align: left; font-size: 13px; padding: 4px 8px; margin: 0;
        background: transparent; border: 1px solid transparent;
      }
      #dialogue .dialogue-choice.selected { background: #333a44; border-color: #556; }
      #dialogue .dialogue-choice.disabled { color: #8a8f99; cursor: default; }
      #dialogue .menu-hint { display: block; font-size: 11px; color: #c9a25a; }
      #dialogue .menu-key { display: inline-block; width: 1.4em; color: #8a8f99; }
      #dialogue .dialogue-note { color: #ff8a8a; font-size: 12px; margin-top: 4px; }
      #dialogue.shake { animation: dialogue-shake 0.3s; }
      @keyframes dialogue-shake {
        0%, 100% { transform: translateX(-50%); }
        25% { transform: translateX(calc(-50% - 6px)); }
        75% { transform: translateX(calc(-50% + 6px)); }
      }
      #tooltip {
        position: fixed; z-index: 9; pointer-events: none; padding: 3px 6px; max-width: 260px;
        font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; color: #e8e8e8;
        background: rgba(15, 17, 22, 0.88); border: 1px solid #556; border-radius: 3px;
      }
      #tooltip[hidden] { display: none; }
      #tooltip .tooltip-hint { color: #8fd3ff; }
      #errors {
        margin: 0; padding: 16px; height: 100%; box-sizing: border-box; overflow: auto;
        font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; color: #ff8a8a; white-space: pre-wrap;
      }
      #errors a { color: #8ab4ff; }
      #picker {
        max-width: 640px; margin: 0 auto; padding: 24px 16px; height: 100%; box-sizing: border-box; overflow: auto;
        font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; color: #e8e8e8;
      }
      #picker h1 { margin: 0 0 16px; font-size: 22px; color: #ffd23f; }
      #picker .picker-row {
        display: block; width: 100%; text-align: left; margin: 6px 0; padding: 8px 10px; font: inherit; color: inherit;
        background: #262a31; border: 1px solid #3a404b; border-radius: 4px; cursor: pointer;
      }
      #picker .picker-row.chosen { border-color: #ffd23f; background: #333a44; }
      #picker .picker-row:disabled { opacity: 0.5; cursor: default; }
      #picker .picker-name { font-weight: bold; color: #ffd23f; }
      #picker .picker-kind, #picker .picker-stack, #picker .picker-hint { font-size: 11px; color: #c9a25a; }
      #picker .picker-subtitle { margin-top: 12px; color: #c9a25a; }
      #picker .picker-mod { display: block; margin: 4px 0; cursor: pointer; }
      #picker .picker-mod.disabled { opacity: 0.5; cursor: default; }
      #picker .picker-desc { font-size: 12px; color: #b8bcc4; }
      #picker .picker-errors { color: #ff8a8a; padding-left: 18px; }
      #picker .picker-footer { margin-top: 16px; }
      #picker input[type=number] { width: 80px; font: inherit; }
      #picker button#picker-play { font: inherit; padding: 2px 16px; cursor: pointer; }
    </style>
  </head>
  <body>
    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
