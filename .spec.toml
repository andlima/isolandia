base_ref = "main"

[paths]
specs_dir = "specs"
task_specs_dir = "specs/tasks"
state_dir = ".spec-state"
worktrees_dir = ".worktrees"

[retry]
cap = 20
no_progress_retry_threshold = 2

[agents]
default = "claude"
review_default = "claude"
allowed = ["claude"]

[bootstrap]
install_command = "npm ci"

[implement]
# setup_command = "scripts/implement-setup.sh"
# teardown_command = "scripts/implement-teardown.sh"

[verify]

[[verify.gates]]
name = "typecheck"
command = "npm run typecheck"
parallel = true

[[verify.gates]]
name = "test"
command = "npm test"
parallel = true

[[verify.gates]]
name = "build"
command = "npm run build"
parallel = true
