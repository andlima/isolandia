# Pixel art on a 2 px art-pixel grid (docs/art.md), generated by
# scripts/pixel-art.mjs from art/noir.mjs: edit the drawings there and
# regenerate rather than editing the SVGs. Characters are 32×48 with their
# feet at [0.5, 0.92] on the tile's ground centre; each lists five drawn
# facings and the rest are mirrored (docs/packs.md#assets).
# Characters also list four walk frames per drawn facing under
# animations.walk; a cycle spans two steps (docs/packs.md#assets).
assets:
  - id: hale_img
    anchor: [0.5, 0.92]
    directions: { s: assets/hale_s.svg, se: assets/hale_se.svg, ne: assets/hale_ne.svg, w: assets/hale_w.svg, nw: assets/hale_nw.svg }
    animations:
      walk:               # 4 frames per drawn facing; a cycle spans two steps
        s:  [assets/hale_s_walk1.svg, assets/hale_s_walk2.svg, assets/hale_s_walk3.svg, assets/hale_s_walk4.svg]
        se: [assets/hale_se_walk1.svg, assets/hale_se_walk2.svg, assets/hale_se_walk3.svg, assets/hale_se_walk4.svg]
        ne: [assets/hale_ne_walk1.svg, assets/hale_ne_walk2.svg, assets/hale_ne_walk3.svg, assets/hale_ne_walk4.svg]
        w:  [assets/hale_w_walk1.svg, assets/hale_w_walk2.svg, assets/hale_w_walk3.svg, assets/hale_w_walk4.svg]
        nw: [assets/hale_nw_walk1.svg, assets/hale_nw_walk2.svg, assets/hale_nw_walk3.svg, assets/hale_nw_walk4.svg]
