# Pixel art on a 2 px art-pixel grid (docs/art.md), generated by
# scripts/pixel-art.mjs from art/noir.mjs: edit the drawings there and
# regenerate rather than editing the SVGs. Characters are 32×48 with their
# feet at [0.5, 0.92] on the tile's ground centre; each lists five drawn
# facings and the rest are mirrored (docs/packs.md#assets).
assets:
  - id: hale_img
    anchor: [0.5, 0.92]
    directions: { s: assets/hale_s.svg, se: assets/hale_se.svg, ne: assets/hale_ne.svg, w: assets/hale_w.svg, nw: assets/hale_nw.svg }
  - id: officer_img
    anchor: [0.5, 0.92]
    directions: { s: assets/officer_s.svg, se: assets/officer_se.svg, ne: assets/officer_ne.svg, w: assets/officer_w.svg, nw: assets/officer_nw.svg }
  - id: widow_img
    anchor: [0.5, 0.92]
    directions: { s: assets/widow_s.svg, se: assets/widow_se.svg, ne: assets/widow_ne.svg, w: assets/widow_w.svg, nw: assets/widow_nw.svg }
  - id: pike_img
    anchor: [0.5, 0.92]
    directions: { s: assets/pike_s.svg, se: assets/pike_se.svg, ne: assets/pike_ne.svg, w: assets/pike_w.svg, nw: assets/pike_nw.svg }
  - id: dot_img
    anchor: [0.5, 0.92]
    directions: { s: assets/dot_s.svg, se: assets/dot_se.svg, ne: assets/dot_ne.svg, w: assets/dot_w.svg, nw: assets/dot_nw.svg }
  - id: mickey_img
    anchor: [0.5, 0.92]
    directions: { s: assets/mickey_s.svg, se: assets/mickey_se.svg, ne: assets/mickey_ne.svg, w: assets/mickey_w.svg, nw: assets/mickey_nw.svg }
