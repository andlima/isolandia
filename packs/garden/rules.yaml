# Energy, hiding and who notices whom (the cat's, the fox's and the
# butterflies' `senses` are in content.yaml). Nothing here touches std:hp. The
# file's `defaults` makes every rule the bunny's unless it writes its own `for`.

defaults:
  for: 'self.has_tag("bunny")'

statuses:
  - id: sleepy
    label: Sleepy
    when: "self.energy <= 35"
    until: "self.energy >= 55"      # a snack or a nap perks the bunny up
    hud: { tone: bad, description: Low on energy; a snack or a nap helps }
  # In a bush the bunny is out of sight of every sense (`conceals`).
  - id: hidden
    label: Hidden
    when: 'tile.has_tag("hiding")'
    conceals: true
    hud: { tone: good, description: Out of sight of the cat and the fox }
  # The cat's playful pounce (the `meow` system below) and the fox's `yip`
  # give the bunny a little fright: the only cost in the garden.
  - id: startled
    label: Startled
    when: "heard(self, 1)"
    rates: { energy: -0.5 }
    hud: { tone: bad, description: A fright; losing energy }

systems:
  - id: nap
    every: 1
    when: 'tile.has_tag("burrow") and self.energy < 90'
    effects:
      - { apply: { energy: 3 } }
  # Gravel crunches under little paws on every hop onto it; the cat and the fox hear it (behaviors.yaml).
  - id: hop
    on: step
    when: 'tile.has_tag("crunchy")'
    effects:
      - { type: noise, radius: 7 }
  # A cat right next to the bunny it sees meows at it. Only the bunny is that
  # close, so only it hears (and gets `startled`).
  - id: meow
    every: 0.5
    for: 'self.has_tag("cat")'
    when: 'self.sees and chebyshev(self, self.seen) <= 1'
    effects:
      - { type: noise, radius: 1.5 }
  # The fox's counterpart: a playful yip right next to the bunny.
  - id: yip
    every: 0.5
    for: 'self.has_tag("fox")'
    when: 'self.sees and chebyshev(self, self.seen) <= 1'
    effects:
      - { type: noise, radius: 1.5 }

# Day/night tint of the iso view (visual only): bright pastel days and a
# soft blue-violet night that stays readable.
lighting:
  tint:
    - { at: "05:00", color: "#8f88d8" }
    - { at: "07:00", color: "#fff0f4" }
    - { at: "12:00", color: "#ffffff" }
    - { at: "18:30", color: "#ffe6d8" }
    - { at: "21:00", color: "#8f88d8" }
