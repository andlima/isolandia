# Energy, hiding and who notices whom. Nothing here touches std:hp.

statuses:
  - id: sleepy
    label: Sleepy
    for: 'self.has_tag("bunny")'
    when: "self.energy <= 35"
    until: "self.energy >= 55"      # a snack or a nap perks the bunny up
    hud: { tone: bad, description: Low on energy; a snack or a nap helps }
  - id: hidden
    label: Hidden
    for: 'self.has_tag("bunny")'
    when: 'tile.has_tag("hiding")'
    hud: { tone: good, description: Out of sight of the cat and the fox }
  # The cat's playful pounce (the `meow` system below) and the fox's `yip`
  # give the bunny a little fright: the only cost in the garden.
  - id: startled
    label: Startled
    for: 'self.has_tag("bunny")'
    when: "heard(self, 1)"
    rates: { energy: -0.5 }
    hud: { tone: bad, description: A fright; losing energy }
  # The cat notices a bunny in the open, and loses interest once it hides.
  - id: curious
    label: Curious
    for: 'self.has_tag("cat")'
    when: 'can_see(self, player, 5) and not has_status(player, "hidden")'
    until: 'not can_see(self, player, 8) or has_status(player, "hidden")'
    hud: { tone: neutral, description: The cat wants to play }
  # The fox does the same, but only once night falls.
  - id: sly
    label: Sly
    for: 'self.has_tag("fox")'
    when: 'not world.is_day and can_see(self, player, 6) and not has_status(player, "hidden")'
    until: 'world.is_day or not can_see(self, player, 9) or has_status(player, "hidden")'
    hud: { tone: bad, description: The fox is watching you }
  - id: alert
    label: Alert
    for: 'self.has_tag("bug")'
    when: "can_see(self, player, 3)"
    until: "not can_see(self, player, 5)"
    hud: { tone: neutral }

systems:
  - id: nap
    every: 1
    for: 'self.has_tag("bunny")'
    when: 'tile.has_tag("burrow") and self.energy < 90'
    effects:
      - { type: apply, measurement: energy, delta: 3 }
  # Gravel crunches under little paws on every hop onto it; the cat and the fox hear it (behaviors.yaml).
  - id: hop
    on: step
    for: 'self.has_tag("bunny")'
    when: 'tile.has_tag("crunchy")'
    effects:
      - { type: noise, radius: 7 }
  # A cat right next to the bunny meows at it. Only the bunny is that close,
  # so only it hears (and gets `startled`).
  - id: meow
    every: 0.5
    for: 'self.has_tag("cat")'
    when: 'self.has_status("curious") and chebyshev(self, player) <= 1'
    effects:
      - { type: noise, radius: 1.5 }
  # The fox's counterpart: a playful yip right next to the bunny.
  - id: yip
    every: 0.5
    for: 'self.has_tag("fox")'
    when: 'self.has_status("sly") and chebyshev(self, player) <= 1'
    effects:
      - { type: noise, radius: 1.5 }

# Day/night tint of the iso view (visual only): bright pastel days and a
# soft blue-violet night that stays readable.
lighting:
  tint:
    - { at: "05:00", color: "#8f88d8" }
    - { at: "07:00", color: "#fff0f4" }
    - { at: "12:00", color: "#ffffff" }
    - { at: "18:30", color: "#ffe6d8" }
    - { at: "21:00", color: "#8f88d8" }
