# Who sees whom is the animals' `senses` (content.yaml); the bunny hides in
# bushes through the `hidden` status (rules.yaml, `conceals`).
behaviors:
  # A sleepy cat naps at home, strolls about, chases a bunny it spots in the
  # open, goes to look at a crunch on the gravel, and soon gets bored.
  - id: cat
    initial: nap
    on:
      # Sight beats sound, in every state but `bored` (it walks home, ignoring the bunny).
      - { when: 'self.sees', to: chase, except: [bored] }
    states:
      nap:
        do: idle
        on:
          - { when: 'heard(self, 1)', to: investigate }
        timeout: { after: 20, to: stroll }
      stroll:
        do: wander
        radius: 6
        on:
          - { when: 'heard(self, 1)', to: investigate }
        timeout: { after: 30, to: home }
      chase:
        do: pursue
        target: self.seen
        on:
          - { when: 'not self.sees', to: home }
        timeout: { after: 15, to: bored }   # yawns and wanders off
      investigate:
        do: investigate
        done: home
      home:
        do: home
        done: nap
      bored:
        do: home
        done: nap

  # Butterflies flutter over their flower bed, flit away from the bunny and
  # drift back once it has gone.
  - id: butterfly
    initial: flutter
    on:
      - { when: 'self.sees', to: flit }
    states:
      flutter:
        do: wander
        radius: 2
      flit:
        do: flee
        target: self.seen
        on:
          - { when: 'not self.sees', to: return }
      return:
        do: home
        done: flutter

  # A fox sleeps in its den all day. At dusk it slinks out to prowl, chases
  # a bunny it spots in the open, sniffs out a crunch on the gravel, and
  # trots home to sleep by morning. Asleep, walking home or bored, it is not
  # woken by a bunny; by day it is in (or heading for) the den.
  - id: fox
    initial: sleep
    on:
      - { when: 'world.is_day', to: den, except: [sleep, bored] }
      - { when: 'self.sees', to: chase, except: [sleep, den, bored] }
    states:
      sleep:
        do: idle
        on:
          - { when: 'not world.is_day', to: prowl }
      prowl:
        do: wander
        radius: 8
        on:
          - { when: 'heard(self, 1)', to: investigate }
      chase:
        do: pursue
        target: self.seen
        on:
          - { when: 'not self.sees', to: prowl }
        timeout: { after: 15, to: bored }   # loses interest and trots home
      investigate:
        do: investigate
        done: prowl
      den:
        do: home
        done: sleep
      bored:
        do: home
        done: sleep
