# Pixel art on a 2 px art-pixel grid with the garden palette (docs/art.md).
# Generated by scripts/pixel-art.mjs from art/garden.mjs: edit the drawings
# there and regenerate rather than editing the SVGs. Flat tiles are 64×32,
# raised tiles 64×64 blocks, both anchored at the diamond's bottom vertex
# (default anchor [0.5, 1]); characters are 32×48 with their feet at
# [0.5, 0.92] on the tile's ground centre; ground piles are 32×32, centred.
# Directional assets list one image per drawn facing; the rest are mirrored
# (see docs/packs.md).
assets:
  - { id: grass_img, file: assets/grass.svg }
  - { id: flowers_img, file: assets/flowers.svg }
  - { id: gravel_img, file: assets/gravel.svg }
  - { id: burrow_img, file: assets/burrow.svg }
  - { id: den_img, file: assets/den.svg }
  - { id: carrot_patch_img, file: assets/carrot_patch.svg }
  - { id: pond_img, file: assets/pond.svg }
  - { id: bush_img, file: assets/bush.svg }               # block, walkable (raised: true)
  - { id: berry_bush_img, file: assets/berry_bush.svg }   # block
  - { id: fence_img, file: assets/fence.svg }             # block
  - id: wheelbarrow_img   # 4-way: n and e are the mirrors of w and s
    directions: { s: assets/wheelbarrow_s.svg, w: assets/wheelbarrow_w.svg }
  - id: bunny_img         # 8-way: n, e and sw are mirrored
    anchor: [0.5, 0.92]   # feet at the shadow's centre
    directions:
      s: assets/bunny_s.svg
      se: assets/bunny_se.svg
      ne: assets/bunny_ne.svg
      w: assets/bunny_w.svg
      nw: assets/bunny_nw.svg
  - id: cat_img           # 8-way: n, e and sw are mirrored
    anchor: [0.5, 0.92]   # feet at the shadow's centre
    directions:
      s: assets/cat_s.svg
      se: assets/cat_se.svg
      ne: assets/cat_ne.svg
      w: assets/cat_w.svg
      nw: assets/cat_nw.svg
  - id: butterfly_img     # 8-way: n, e and sw are mirrored
    anchor: [0.5, 0.92]   # feet at the shadow's centre
    directions:
      s: assets/butterfly_s.svg
      se: assets/butterfly_se.svg
      ne: assets/butterfly_ne.svg
      w: assets/butterfly_w.svg
      nw: assets/butterfly_nw.svg
  - id: fox_img           # 8-way: n, e and sw are mirrored
    anchor: [0.5, 0.92]   # feet at the shadow's centre
    directions:
      s: assets/fox_s.svg
      se: assets/fox_se.svg
      ne: assets/fox_ne.svg
      w: assets/fox_w.svg
      nw: assets/fox_nw.svg
  - { id: carrot_img, file: assets/carrot.svg, anchor: [0.5, 0.5] }
  - { id: clover_img, file: assets/clover.svg, anchor: [0.5, 0.5] }
  - { id: strawberry_img, file: assets/strawberry.svg, anchor: [0.5, 0.5] }
  - { id: acorn_img, file: assets/acorn.svg, anchor: [0.5, 0.5] }
  - { id: feather_img, file: assets/feather.svg, anchor: [0.5, 0.5] }
