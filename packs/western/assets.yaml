        ne: [assets/doc_ne_walk1.svg, assets/doc_ne_walk2.svg, assets/doc_ne_walk3.svg, assets/doc_ne_walk4.svg]
        w:  [assets/doc_w_walk1.svg, assets/doc_w_walk2.svg, assets/doc_w_walk3.svg, assets/doc_w_walk4.svg]
        nw: [assets/doc_nw_walk1.svg, assets/doc_nw_walk2.svg, assets/doc_nw_walk3.svg, assets/doc_nw_walk4.svg]
