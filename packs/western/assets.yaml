# Pixel art on a 2 px art-pixel grid (docs/art.md), generated by
# scripts/pixel-art.mjs from art/western.mjs: edit the drawings there and
# regenerate rather than editing the SVGs. Characters are 32×48 with their
# feet at [0.5, 0.92] on the tile's ground centre, five drawn facings each
# (the rest are mirrored); items are small ground piles centred on the
# ground centre.
assets:
  - id: sheriff_img
    anchor: [0.5, 0.92]
    directions: { s: assets/sheriff_s.svg, se: assets/sheriff_se.svg, ne: assets/sheriff_ne.svg, w: assets/sheriff_w.svg, nw: assets/sheriff_nw.svg }
  - id: doc_img
    anchor: [0.5, 0.92]
    directions: { s: assets/doc_s.svg, se: assets/doc_se.svg, ne: assets/doc_ne.svg, w: assets/doc_w.svg, nw: assets/doc_nw.svg }
  - id: bartender_img
    anchor: [0.5, 0.92]
    directions: { s: assets/bartender_s.svg, se: assets/bartender_se.svg, ne: assets/bartender_ne.svg, w: assets/bartender_w.svg, nw: assets/bartender_nw.svg }
  - id: kid_img
    anchor: [0.5, 0.92]
    directions: { s: assets/kid_s.svg, se: assets/kid_se.svg, ne: assets/kid_ne.svg, w: assets/kid_w.svg, nw: assets/kid_nw.svg }
  - id: rider_img
    anchor: [0.5, 0.92]
    directions: { s: assets/rider_s.svg, se: assets/rider_se.svg, ne: assets/rider_ne.svg, w: assets/rider_w.svg, nw: assets/rider_nw.svg }
  - id: black_jack_img
    anchor: [0.5, 0.92]
    directions: { s: assets/black_jack_s.svg, se: assets/black_jack_se.svg, ne: assets/black_jack_ne.svg, w: assets/black_jack_w.svg, nw: assets/black_jack_nw.svg }
  - { id: coin_img, file: assets/coin.svg, anchor: [0.5, 0.5] }
  - { id: bullet_img, file: assets/bullet.svg, anchor: [0.5, 0.5] }
  - { id: whiskey_img, file: assets/whiskey.svg, anchor: [0.5, 0.5] }
  - { id: revolver_img, file: assets/revolver.svg, anchor: [0.5, 0.5] }
