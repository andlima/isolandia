# Pixel art on a 2 px art-pixel grid (docs/art.md), generated by
# scripts/pixel-art.mjs from art/western.mjs: edit the drawings there and
# regenerate rather than editing the SVGs. Characters are 32×48 with their
# feet at [0.5, 0.92] on the tile's ground centre, five drawn facings each
# (the rest are mirrored); items are small ground piles centred on the
# ground centre.
# Characters also list four walk frames per drawn facing under
# animations.walk; a cycle spans two steps (docs/packs.md#assets).
assets:
  - id: sheriff_img
    anchor: [0.5, 0.92]
    directions: { s: assets/sheriff_s.svg, se: assets/sheriff_se.svg, ne: assets/sheriff_ne.svg, w: assets/sheriff_w.svg, nw: assets/sheriff_nw.svg }
    animations:
      walk:               # 4 frames per drawn facing; a cycle spans two steps
        s:  [assets/sheriff_s_walk1.svg, assets/sheriff_s_walk2.svg, assets/sheriff_s_walk3.svg, assets/sheriff_s_walk4.svg]
        se: [assets/sheriff_se_walk1.svg, assets/sheriff_se_walk2.svg, assets/sheriff_se_walk3.svg, assets/sheriff_se_walk4.svg]
        ne: [assets/sheriff_ne_walk1.svg, assets/sheriff_ne_walk2.svg, assets/sheriff_ne_walk3.svg, assets/sheriff_ne_walk4.svg]
        w:  [assets/sheriff_w_walk1.svg, assets/sheriff_w_walk2.svg, assets/sheriff_w_walk3.svg, assets/sheriff_w_walk4.svg]
        nw: [assets/sheriff_nw_walk1.svg, assets/sheriff_nw_walk2.svg, assets/sheriff_nw_walk3.svg, assets/sheriff_nw_walk4.svg]
  - id: doc_img
