measurements:
  - id: hp
    label: Health
    min: 0
    max: 100
    initial: 100
    hud: { bad: low }              # warn at 50, danger at 25

archetypes:
  - id: humanoid
    label: Person
    glyph: "@"
    color: white
    sprite: humanoid_img
    tags: [humanoid]
    measurements: [hp]
    # Gaits (ticks per tile at 10 ticks/s): walk 2 (the default), run 1 and loud, sneak 4 and silent.
    gaits:
      run: { ticks_per_step: 1, noise: 6, label: Running }
      sneak: { ticks_per_step: 4, label: Sneaking }
