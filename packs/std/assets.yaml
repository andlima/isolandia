# Pixel art on a 2 px art-pixel grid with the std palette (docs/art.md).
# Generated by scripts/pixel-art.mjs from art/std.mjs: edit the drawings
# there and regenerate rather than editing the SVGs. Flat tiles are 64×32,
# raised tiles 64×64 blocks, both anchored at the diamond's bottom vertex
# (default anchor [0.5, 1]); characters are 32×48 with their feet at
# [0.5, 0.92] on the tile's ground centre; ground piles are 32×32, centred.
# Directional assets list one image per drawn facing; the rest are mirrored
# (see docs/packs.md).
assets:
  - { id: floor_img, file: assets/floor.svg }   # flat
  - { id: wall_img, file: assets/wall.svg }   # block
  - { id: door_img, file: assets/door.svg }   # block, walkable (raised: true)
  - id: stairs_img        # 4-way: n and e are the mirrors of w and s; rises toward its facing
    directions: { s: assets/stairs_s.svg, w: assets/stairs_w.svg }
  - { id: landing_img, file: assets/landing.svg }   # flat
  - id: humanoid_img      # 8-way: n, e and sw are mirrored
    anchor: [0.5, 0.92]   # feet at the shadow's centre
    directions:
      s: assets/humanoid_s.svg
      se: assets/humanoid_se.svg
      ne: assets/humanoid_ne.svg
      w: assets/humanoid_w.svg
      nw: assets/humanoid_nw.svg
