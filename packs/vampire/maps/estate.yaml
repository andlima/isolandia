# The estate around the mansion: a composite map (docs/packs.md#composite-maps)
# of the mansion (Tiled) and two ASCII part maps, each placed several times.
# Outside, the sun falls on open ground (`sunbeam`); only the buildings shade.
maps:
  # A walled plot of crypt floor and three rows of coffins with 2-wide aisles
  # between them, and a gate on the south side. Bats roost among the graves
  # (8 per plot).
  - id: graveyard
    legend:
      "#": { tile: wall }
      "+": { tile: door }
      "_": { tile: crypt }
      "=": { tile: coffin, facing: s }
      "'": { tile: sunbeam }
    rows:
      - "#################"
      - "#_______________#"
      - "#_______________#"
      - "#_=__=__=__=__=_#"
      - "#_______________#"
      - "#_______________#"
      - "#_=__=__=__=__=_#"
      - "#_______________#"
      - "#_______________#"
      - "#_=__=__=__=__=_#"
      - "#_______________#"
      - "#_______________#"
      - "########+########"
      - "'''''''''''''''''"
    populate:
      - { archetype: bat, count: 8 }
  # A village cottage: carpet and creaky boards, a chest of heirlooms and
  # bookshelves (empty: only the mansion's library is stocked) against the
  # north wall, and a clear way in from the door.
  - id: cottage
    legend:
      "#": { tile: wall }
      "+": { tile: door }
      '"': { tile: town:window }
      ".": { tile: carpet }
      ",": { tile: creaky }
      "X": { tile: chest, facing: s }
      "L": { tile: bookshelf, facing: s }
      "'": { tile: sunbeam }
    rows:
      - '####"####"####'
      - "#X...,.....LL#"
      - "#............#"
      - "#............#"
      - '"............"'
      - "#....,.......#"
      - "#............#"
      - "#............#"
      - "######+#######"
      - "''''''''''''''"
    rooms:
      - { rect: [1, 1, 12, 7], tags: [cottage] }
    populate:
      - { archetype: bat, count: 1, room: cottage }
  - id: estate
    size: [128, 128]
    fill: sunbeam
    player: [63, 60]                 # in the great hall (the mansion is at [49, 54])
    parts:
      - { map: mansion, at: [49, 54] }
      - { map: graveyard, at: [8, 8] }
      - { map: graveyard, at: [103, 8] }
      - { map: graveyard, at: [8, 34] }
      - { map: graveyard, at: [103, 34] }
      - { map: cottage, at: [8, 106] }
      - { map: cottage, at: [27, 106] }
      - { map: cottage, at: [46, 106] }
      - { map: cottage, at: [68, 106] }
      - { map: cottage, at: [87, 106] }
      - { map: cottage, at: [106, 106] }
    # Bats over the grounds; the mansion's surroundings start clear.
    populate:
      - { archetype: bat, count: 40, rect: [0, 0, 128, 40] }
      - { archetype: bat, count: 30, rect: [0, 82, 128, 46] }
      - { archetype: bat, count: 20, rect: [0, 40, 40, 42] }
      - { archetype: bat, count: 20, rect: [90, 40, 38, 42] }
