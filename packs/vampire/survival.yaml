# Survival loop: the sun burns, hunger for blood weakens. Carpet, crypt and
# font tiles are shaded; sunbeams under the windows are not. Blood vials from
# the cellar's wine racks (items.yaml) restore blood anywhere.

statuses:
  - id: sunburnt
    label: Sunburnt
    for: 'self.has_tag("undead")'
    # A heavy cloak in the inventory keeps the sun off.
    when: 'world.is_day and tile.has_tag("sunlit") and not self.has_item("cloak")'
    until: 'not world.is_day or tile.has_tag("shade")'   # lingers until you find real shade
    rates: { hp: -4 }
  - id: starving
    label: Starving
    for: 'self.has_tag("undead")'
    when: "self.blood <= 10"
    until: "self.blood >= 25"
    rates: { hp: -0.25 }
  # Bats notice the vampire (through windows too) and lose interest slowly.
  - id: alert
    label: Alert
    for: 'self.has_tag("beast")'
    when: 'can_see(self, player, 6)'
    until: 'not can_see(self, player, 10)'

systems:
  # Hurting.
  - id: scorch
    every: 1
    for: 'self.has_status("sunburnt")'
    effects:
      - { type: apply, measurement: blood, delta: -1 }
  - id: daylight
    every: 1
    for: 'self.has_tag("undead")'
    when: 'world.is_day and not tile.has_tag("shade")'
    effects:
      - { type: apply, measurement: hp, delta: -0.2 }
  # Restoring.
  - id: feed
    every: 1
    for: 'self.has_tag("undead")'
    when: 'tile.has_tag("blood")'
    effects:
      - { type: apply, measurement: blood, delta: 5 }
  - id: mend
    every: 5
    for: 'self.has_tag("undead")'
    when: "self.blood >= 30 and not self.has_status(\"starving\")"
    effects:
      - { type: apply, measurement: hp, delta: 1 }

# Day/night tint of the iso view (visual only): cold nights, harsh days.
lighting:
  tint:
    - { at: "05:00", color: "#2a3060" }
    - { at: "07:00", color: "#fff4e0" }
    - { at: "19:00", color: "#ffc8a0" }
    - { at: "21:00", color: "#2a3060" }
