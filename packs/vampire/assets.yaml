# Pixel art on a 2 px art-pixel grid with the vampire palette (docs/art.md).
# Generated by scripts/pixel-art.mjs from art/vampire.mjs: edit the drawings
# there and regenerate rather than editing the SVGs. Flat tiles are 64×32,
# raised tiles 64×64 blocks, both anchored at the diamond's bottom vertex
# (default anchor [0.5, 1]); characters are 32×48 with their feet at
# [0.5, 0.92] on the tile's ground centre; ground piles are 32×32, centred.
# Directional assets list one image per drawn facing; the rest are mirrored
# (see docs/packs.md).
assets:
  - { id: carpet_img, file: assets/carpet.svg }
  - { id: creaky_img, file: assets/creaky.svg }
  - { id: sunbeam_img, file: assets/sunbeam.svg }
  - { id: crypt_img, file: assets/crypt.svg }
  - { id: font_img, file: assets/font.svg }
  - { id: window_img, file: assets/window.svg }   # block
  - { id: shuttered_window_img, file: assets/shuttered_window.svg }   # block
  - id: coffin_img        # 4-way: n and e are the mirrors of w and s
    directions: { s: assets/coffin_s.svg, w: assets/coffin_w.svg }
  - id: bookshelf_img     # 4-way: n and e are the mirrors of w and s
    directions: { s: assets/bookshelf_s.svg, w: assets/bookshelf_w.svg }
  - id: chest_img         # 4-way: n and e are the mirrors of w and s
    directions: { s: assets/chest_s.svg, w: assets/chest_w.svg }
  - id: wine_rack_img     # 4-way: n and e are the mirrors of w and s
    directions: { s: assets/wine_rack_s.svg, w: assets/wine_rack_w.svg }
  - id: vampire_img       # 8-way: n, e and sw are mirrored
    anchor: [0.5, 0.92]   # feet at the shadow's centre
    directions:
      s: assets/vampire_s.svg
      se: assets/vampire_se.svg
      ne: assets/vampire_ne.svg
      w: assets/vampire_w.svg
      nw: assets/vampire_nw.svg
  - id: bat_img           # 8-way: n, e and sw are mirrored
    anchor: [0.5, 0.92]   # feet at the shadow's centre
    directions:
      s: assets/bat_s.svg
      se: assets/bat_se.svg
      ne: assets/bat_ne.svg
      w: assets/bat_w.svg
      nw: assets/bat_nw.svg
  - { id: blood_vial_img, file: assets/blood_vial.svg, anchor: [0.5, 0.5] }
  - { id: cloak_img, file: assets/cloak.svg, anchor: [0.5, 0.5] }
  - { id: wine_img, file: assets/wine.svg, anchor: [0.5, 0.5] }
  - { id: empty_vial_img, file: assets/empty_vial.svg, anchor: [0.5, 0.5] }
  - { id: blood_wine_img, file: assets/blood_wine.svg, anchor: [0.5, 0.5] }
  - { id: tome_img, file: assets/tome.svg, anchor: [0.5, 0.5] }
  - { id: candle_img, file: assets/candle.svg, anchor: [0.5, 0.5] }
