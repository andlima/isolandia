measurements:
  - id: blood
    label: Blood
    min: 0
    # Blood capacity is tied to health: half of current hp, at least 10.
    max: "max(10, self.base:hp / 2)"
    initial: 50
    # Drains 0.05 per second at night, 0.1 in daylight.
    rate: "-0.05 - 0.05 * world.is_day"

tiles:
  - id: carpet
    label: Carpet
    glyph: "."
    color: "#8b1e2d"
    walkable: true
    sprite: carpet_img
    tags: [shade]
  - id: sunbeam
    label: Sunlit floor
    glyph: "'"
    color: "#e8d27a"
    walkable: true
    tags: [sunlit]
  - id: crypt
    label: Crypt floor
    glyph: "_"
    color: "#3b3346"
    walkable: true
    tags: [shade, crypt]
  - id: font
    label: Blood font
    glyph: "u"
    color: "#c0182c"
    walkable: true
    tags: [shade, blood]
  - id: coffin
    label: Coffin
    glyph: "="
    color: "#4a3426"
    walkable: false
    sprite: coffin_img
  - id: window
    label: Window
    glyph: "\""
    color: "#6fa8dc"
    walkable: false
  - id: bookshelf
    label: Bookshelf
    glyph: "L"
    color: "#6a4a2a"
    walkable: false
    container: { capacity: 20 }
  - id: chest
    label: Oak chest
    glyph: "X"
    color: "#8a6a3a"
    walkable: false
    container: { capacity: 30 }
  - id: wine_rack
    label: Wine rack
    glyph: "R"
    color: "#5a1a2a"
    walkable: false
    container: { capacity: 8 }

archetypes:
  - id: vampire
    label: Vampire
    glyph: V
    color: "#e0e0ff"
    sprite: vampire_img
    tags: [humanoid, undead]
    measurements: [hp, blood]
    ticks_per_step: 1
    inventory:
      capacity: 8
      items: { blood_vial: 1 }
  - id: bat
    label: Bat
    glyph: b
    color: "#7a5c8a"
    tags: [beast]
    measurements: [hp]
    initial: { hp: 5 }

# The night begins as the game does: it starts at dusk.
clock:
  start: "20:00"

start:
  map: mansion
  player: vampire
  defeat:
    when: "self.hp <= 0"
    message: "Your unlife has ended."
