# Imported art (docs/art.md#imported-art): Kenney's CC0 isometric packs,
# see CREDITS.md. Generated by scripts/import-art.mjs from
# art/imports/zombie-kenney.mjs: edit the recipe and rerun rather than
# editing the PNGs. Each is drawn at @2x (128 px images for the 64 px
# diamond), so it stays sharp when zoomed. Flat tiles fill the diamond with
# the default anchor; the car is a 64×64 block with the road under it.
assets:
  - { id: road_img, file: assets/road@2x.png }
  - { id: grass_img, file: assets/grass@2x.png }
  - { id: floor_img, file: assets/floor@2x.png }     # also the landing
  - id: car_img           # 4-way: n and e are the mirrors of w and s
    directions: { s: assets/car_s@2x.png, w: assets/car_w@2x.png }
