tiles:
  - id: road
    label: Road
    glyph: ":"
    color: "#555555"
    walkable: true
  - id: grass
    label: Grass
    glyph: ","
    color: "#2f7d32"
    walkable: true
    sprite: grass_img
  - id: car
    label: Wrecked car
    glyph: "&"
    color: "#a33a2a"
    walkable: false
    sprite: car_img
    container: { capacity: 6 }      # the glovebox
  # Crunches underfoot: a `crunch` system makes noise (survival.yaml).
  - id: glass
    label: Broken glass
    glyph: "*"
    color: "#a8d8e8"
    walkable: true
    opaque: false
    tags: [glass]
  - id: bed
    label: Bed
    glyph: "="
    color: "#8e6fb5"
    walkable: true
    tags: [bed]
  # Containers, filled by `distributions` (loot.yaml).
  - id: fridge
    label: Fridge
    glyph: "F"
    color: "#e8e8f0"
    walkable: false
    container: { capacity: 25 }
  - id: cupboard
    label: Cupboard
    glyph: "K"
    color: "#9a6a3a"
    walkable: false
    container: { capacity: 12 }
  - id: cabinet
    label: Medicine cabinet
    glyph: "M"
    color: "#d0e0e0"
    walkable: false
    container: { capacity: 3 }
  - id: dresser
    label: Dresser
    glyph: "D"
    color: "#7a5230"
    walkable: false
    container: { capacity: 15 }
  - id: crate
    label: Crate
    glyph: "x"
    color: "#b08850"
    walkable: true                  # a floor crate you can stand on
    container: { capacity: 40 }
