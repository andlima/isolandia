start:
  map: city
  player: survivor
  defeat:
    when: "self.hp <= 0"
    message: "You did not survive the outbreak."
  # Scale (docs/packs.md#simulation): the dead further than 64 tiles from the
  # survivor rest until they come near; A* gives up early for them.
  simulation:
    active_radius: 64
    npc_path_budget: 4000
    player_path_budget: 60000
