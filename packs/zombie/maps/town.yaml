maps:
  - id: town
    legend:
      ".": { tile: floor }
      "#": { tile: wall }
      "+": { tile: door }
      ":": { tile: road }
      ",": { tile: grass }
      "&": { tile: car }
      "b": { tile: bed }
      "F": { tile: fridge }
      "K": { tile: cupboard }
      "M": { tile: cabinet }
      "D": { tile: dresser }
      "x": { tile: crate }
      "*": { tile: glass }
      "@": { tile: road, player: true }
      "Z": { tile: road, spawn: shambler }
      "G": { tile: grass, spawn: shambler }
      "z": { tile: floor, spawn: crawler }
