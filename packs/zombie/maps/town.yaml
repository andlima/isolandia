maps:
  - id: town
    legend:
      ".": { tile: floor }
      "#": { tile: wall }
      "+": { tile: door }
      ":": { tile: road }
      ",": { tile: grass }
      "&": { tile: car, facing: e }
      "%": { tile: car, facing: w }
      "b": { tile: bed }
      "F": { tile: fridge, facing: s }   # against a north wall
      "f": { tile: fridge, facing: n }   # against a south wall
      "K": { tile: cupboard }
      "M": { tile: cabinet }
      "D": { tile: dresser }
      "x": { tile: crate }
      "*": { tile: glass }
      "W": { tile: window }
      "S": { tile: stove }
      "@": { tile: road, player: true }
      "Z": { tile: road, spawn: shambler }
      "G": { tile: grass, spawn: shambler }
      "z": { tile: floor, spawn: crawler }
    rows:
      - ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"
      - ",####W######W####,,,,,,,,,,####W######W####,"
      - ",#FKKS#M.#D....b#,,,,,,,,,,#FKKS#M.#D....b#,"
      - ",W....#..#......W,,,G,,,,,,W....#..#......W,"
      - ",#....#..#......#,,,,x,,,,,#....#..#......#,"
      - ",##+####+###+####,,,,,,,,,,##+####+###+####,"
      - ",#..z.......*...#,,,,,,,,,,#..............#,"
      - ",#######+########,,,,,,,,,,#######+########,"
      - ",,,,,,,,*,,,,,,,,,,,,,,,,,,,,,,,,,*,,,,,,,,,"
      - "::::::::::::::::::::%:::::::::::::::::::::::"
      - ":::::&::::::::::Z:::::::::@:::::::::::&:::::"
      - "::::::::::::::::::::::::::::::::::::::::::::"
      - ",,,,,,,,*,,,,,,,,,,,,,,,,,,,,,,,,,*,,,,,,,,,"
      - ",#######+########,,,,,,,,,,#######+########,"
      - ",#..............#,,,,,,,,,,#..*....z......#,"
      - ",##+####+###+####,,,,,,,,,,##+####+###+####,"
      - ",#....#..#......#,,,,,G,,,,#....#..#......#,"
      - ",W....#..#......W,,,x,,,,,,W....#..#......W,"
      - ",#fKKS#M.#D....b#,,,,,,,,,,#fKKS#M.#D....b#,"
      - ",####W######W####,,,,,,,,,,####W######W####,"
      - ",,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,"
