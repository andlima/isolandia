# Looting: food, drink and medicine are items used from the inventory.
items:
  - id: canned_beans
    label: Canned beans
    glyph: "%"
    color: "#c9a227"
    weight: 0.4
    tags: [food]
    use:
      label: Eat
      effects:
        - { type: apply, measurement: hunger, delta: -35 }
  - id: crackers
    label: Crackers
    glyph: "%"
    color: "#e0c080"
    weight: 0.2
    tags: [food]
    use:
      label: Eat
      effects:
        - { type: apply, measurement: hunger, delta: -12 }
        - { type: apply, measurement: thirst, delta: 3 }     # salty
  - id: water_bottle
    label: Water bottle
    glyph: "!"
    color: "#3b8eea"
    weight: 0.5
    tags: [drink]
    use:
      label: Drink
      effects:
        - { type: apply, measurement: thirst, delta: -35 }
  - id: soda
    label: Soda can
    glyph: "!"
    color: "#d0402a"
    weight: 0.35
    tags: [drink]
    use:
      label: Drink
      effects:
        - { type: apply, measurement: thirst, delta: -18 }
        - { type: apply, measurement: hunger, delta: -4 }
  - id: coffee
    label: Instant coffee
    glyph: "!"
    color: "#6b4226"
    weight: 0.3
    use:
      label: Drink
      effects:
        - { type: apply, measurement: fatigue, delta: -35 }
        - { type: apply, measurement: thirst, delta: 5 }
  - id: bandage
    label: Bandage
    glyph: "+"
    color: "#f0f0f0"
    weight: 0.1
    tags: [medical]
    use:
      label: Apply
      when: "self.hp < 100"
      effects:
        - { type: apply, measurement: hp, delta: 20 }
  # Heavy junk: worth nothing, weighs a lot.
  - { id: toaster, label: Toaster, glyph: "]", color: "#a0a0a0", weight: 3, tags: [junk] }
  - { id: lamp, label: Desk lamp, glyph: "]", color: "#d8d070", weight: 2.5, tags: [junk] }
  - { id: magazine, label: Magazine, glyph: "?", color: "#c080c0", weight: 0.3, tags: [junk] }
  - { id: car_battery, label: Car battery, glyph: "]", color: "#404040", weight: 8, tags: [junk] }
