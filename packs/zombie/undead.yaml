# The undead shuffle around where they rose, chase a survivor they see (their
# `senses` in archetypes.yaml: noticed at 8 tiles, followed out to 12),
# shuffle over to any noise they hear (the town's broken glass, alarm clocks
# and hammering), and linger a while where they lost track before wandering
# off again.
behaviors:
  - id: shambler
    initial: wander
    on:
      # Sight beats sound: checked before any state's own transitions.
      - { when: 'self.sees', to: chase }
    states:
      wander:
        do: wander
        radius: 6
        on:
          - { when: 'heard(self, 1)', to: investigate }
      investigate:
        do: investigate
        done: search
      chase:
        do: pursue
        target: self.seen
        on:
          - { when: 'not self.sees', to: search }
      search:
        do: idle
        on:
          - { when: 'heard(self, 1)', to: investigate }
        timeout: { after: 5, to: wander }
