# Pixel art on a 2 px art-pixel grid with the town palette (docs/art.md).
# Generated by scripts/pixel-art.mjs from art/zombie.mjs: edit the drawings
# there and regenerate rather than editing the SVGs. Characters are 32×48
# with their feet at [0.5, 0.92] on the tile's ground centre. Directional
# assets list one image per drawn facing; the rest are mirrored (see
# docs/packs.md).
assets:
  - id: shambler_img      # 8-way: n, e and sw are mirrored
    anchor: [0.5, 0.92]   # feet at the shadow's centre
    directions:
      s: assets/shambler_s.svg
      se: assets/shambler_se.svg
      ne: assets/shambler_ne.svg
      w: assets/shambler_w.svg
      nw: assets/shambler_nw.svg
  - id: crawler_img       # 8-way: n, e and sw are mirrored
    anchor: [0.5, 0.92]   # feet at the shadow's centre
    directions:
      s: assets/crawler_s.svg
      se: assets/crawler_se.svg
      ne: assets/crawler_ne.svg
      w: assets/crawler_w.svg
      nw: assets/crawler_nw.svg
