# Pixel art on a 2 px art-pixel grid with the zombie palette (docs/art.md).
# Generated by scripts/pixel-art.mjs from art/zombie.mjs: edit the drawings
# there and regenerate rather than editing the SVGs. Flat tiles are 64×32,
# raised tiles 64×64 blocks, both anchored at the diamond's bottom vertex
# (default anchor [0.5, 1]); characters are 32×48 with their feet at
# [0.5, 0.92] on the tile's ground centre; ground piles are 32×32, centred.
# Directional assets list one image per drawn facing; the rest are mirrored
# (see docs/packs.md).
assets:
  - { id: road_img, file: assets/road.svg }
  - { id: grass_img, file: assets/grass.svg }
  - { id: glass_img, file: assets/glass.svg }
  - { id: crate_img, file: assets/crate.svg }   # block
  - { id: window_img, file: assets/window.svg }   # block
  - { id: barricaded_window_img, file: assets/barricaded_window.svg }   # block
  - { id: stove_img, file: assets/stove.svg }   # block
  - id: car_img           # 4-way: n and e are the mirrors of w and s
    directions: { s: assets/car_s.svg, w: assets/car_w.svg }
  - id: bed_img           # 4-way: n and e are the mirrors of w and s
    directions: { s: assets/bed_s.svg, w: assets/bed_w.svg }
  - id: fridge_img        # 4-way: n and e are the mirrors of w and s
    directions: { s: assets/fridge_s.svg, w: assets/fridge_w.svg }
  - id: cupboard_img      # 4-way: n and e are the mirrors of w and s
    directions: { s: assets/cupboard_s.svg, w: assets/cupboard_w.svg }
  - id: cabinet_img       # 4-way: n and e are the mirrors of w and s
    directions: { s: assets/cabinet_s.svg, w: assets/cabinet_w.svg }
  - id: dresser_img       # 4-way: n and e are the mirrors of w and s
    directions: { s: assets/dresser_s.svg, w: assets/dresser_w.svg }
  - id: survivor_img      # 8-way: n, e and sw are mirrored
    anchor: [0.5, 0.92]   # feet at the shadow's centre
    directions:
      s: assets/survivor_s.svg
      se: assets/survivor_se.svg
      ne: assets/survivor_ne.svg
      w: assets/survivor_w.svg
      nw: assets/survivor_nw.svg
  - id: shambler_img      # 8-way: n, e and sw are mirrored
    anchor: [0.5, 0.92]   # feet at the shadow's centre
    directions:
      s: assets/shambler_s.svg
      se: assets/shambler_se.svg
      ne: assets/shambler_ne.svg
      w: assets/shambler_w.svg
      nw: assets/shambler_nw.svg
  - id: crawler_img       # 8-way: n, e and sw are mirrored
    anchor: [0.5, 0.92]   # feet at the shadow's centre
    directions:
      s: assets/crawler_s.svg
      se: assets/crawler_se.svg
      ne: assets/crawler_ne.svg
      w: assets/crawler_w.svg
      nw: assets/crawler_nw.svg
  - { id: canned_beans_img, file: assets/canned_beans.svg, anchor: [0.5, 0.5] }
  - { id: crackers_img, file: assets/crackers.svg, anchor: [0.5, 0.5] }
  - { id: water_bottle_img, file: assets/water_bottle.svg, anchor: [0.5, 0.5] }
  - { id: soda_img, file: assets/soda.svg, anchor: [0.5, 0.5] }
  - { id: coffee_img, file: assets/coffee.svg, anchor: [0.5, 0.5] }
  - { id: bandage_img, file: assets/bandage.svg, anchor: [0.5, 0.5] }
  - { id: hammer_img, file: assets/hammer.svg, anchor: [0.5, 0.5] }
  - { id: plank_img, file: assets/plank.svg, anchor: [0.5, 0.5] }
  - { id: nails_img, file: assets/nails.svg, anchor: [0.5, 0.5] }
  - { id: hot_beans_img, file: assets/hot_beans.svg, anchor: [0.5, 0.5] }
  - { id: rag_img, file: assets/rag.svg, anchor: [0.5, 0.5] }
  - { id: alarm_clock_img, file: assets/alarm_clock.svg, anchor: [0.5, 0.5] }
  - { id: toaster_img, file: assets/toaster.svg, anchor: [0.5, 0.5] }
  - { id: lamp_img, file: assets/lamp.svg, anchor: [0.5, 0.5] }
  - { id: magazine_img, file: assets/magazine.svg, anchor: [0.5, 0.5] }
  - { id: car_battery_img, file: assets/car_battery.svg, anchor: [0.5, 0.5] }
