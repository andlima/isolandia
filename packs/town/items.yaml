# Looting: food, drink and medicine are items used from the inventory.
items:
  - id: canned_beans
    label: Canned beans
    glyph: "%"
    color: "#c9a227"
    sprite: canned_beans_img
    weight: 0.4
    tags: [food]
    use:
      label: Eat
      effects:
        - { type: apply, measurement: hunger, delta: -35 }
  # Cooked on a stove (recipes.yaml): more filling than cold beans, and warming.
  - id: hot_beans
    label: Hot beans
    glyph: "%"
    color: "#d0602a"
    sprite: hot_beans_img
    weight: 0.4
    tags: [food]
    use:
      label: Eat
      effects:
        - { type: apply, measurement: hunger, delta: -45 }
        - { type: apply, measurement: fatigue, delta: -5 }
  - id: crackers
    label: Crackers
    glyph: "%"
    color: "#e0c080"
    sprite: crackers_img
    weight: 0.2
    tags: [food]
    use:
      label: Eat
      effects:
        - { type: apply, measurement: hunger, delta: -12 }
        - { type: apply, measurement: thirst, delta: 3 }     # salty
  - id: water_bottle
    label: Water bottle
    glyph: "!"
    color: "#3b8eea"
    sprite: water_bottle_img
    weight: 0.5
    tags: [drink]
    use:
      label: Drink
      effects:
        - { type: apply, measurement: thirst, delta: -35 }
  - id: soda
    label: Soda can
    glyph: "!"
    color: "#d0402a"
    sprite: soda_img
    weight: 0.35
    tags: [drink]
    use:
      label: Drink
      effects:
        - { type: apply, measurement: thirst, delta: -18 }
        - { type: apply, measurement: hunger, delta: -4 }
  - id: coffee
    label: Instant coffee
    glyph: "!"
    color: "#6b4226"
    sprite: coffee_img
    weight: 0.3
    use:
      label: Drink
      effects:
        - { type: apply, measurement: fatigue, delta: -35 }
        - { type: apply, measurement: thirst, delta: 5 }
  - id: bandage
    label: Bandage
    glyph: "+"
    color: "#f0f0f0"
    sprite: bandage_img
    weight: 0.1
    tags: [medical]
    use:
      label: Apply
      when: "self.hp < 100"
      duration: 3                   # sim seconds; moving or acting cancels it
      # A noise nearby startles you and wastes the attempt (the bandage is
      # kept). Hearing lands after the work step, so 0.2 s is the shortest
      # window the next tick's interrupt check still sees.
      interrupt: "heard(self, 0.2)"
      effects:
        - { type: apply, measurement: hp, delta: 20 }
  # Rings loud enough to be heard across the block.
  - id: alarm_clock
    label: Alarm clock
    glyph: "o"
    color: "#d8c040"
    sprite: alarm_clock_img
    weight: 0.5
    use:
      label: Wind up
      consume: 0                    # reusable
      effects:
        - { type: noise, radius: 20 }
  # Barricading (actions.yaml): the hammer is a tool, planks and nails are used up.
  - { id: hammer, label: Hammer, glyph: "T", color: "#a07242", weight: 1, tags: [tool], sprite: hammer_img }
  - { id: plank, label: Plank, glyph: "/", color: "#c89a5a", weight: 1, tags: [material], sprite: plank_img }
  - { id: nails, label: Nails, glyph: ";", color: "#a6a8b4", weight: 0.02, tags: [material], sprite: nails_img }
  # Torn into bandages (recipes.yaml).
  - { id: rag, label: Rag, glyph: "~", color: "#5a7aaa", weight: 0.1, tags: [material], sprite: rag_img }
  # Heavy junk: worth nothing, weighs a lot.
  - { id: toaster, label: Toaster, glyph: "]", color: "#a0a0a0", weight: 3, tags: [junk], sprite: toaster_img }
  - { id: lamp, label: Desk lamp, glyph: "]", color: "#d8d070", weight: 2.5, tags: [junk], sprite: lamp_img }
  - { id: magazine, label: Magazine, glyph: "?", color: "#c080c0", weight: 0.3, tags: [junk], sprite: magazine_img }
  - { id: car_battery, label: Car battery, glyph: "]", color: "#404040", weight: 8, tags: [junk], sprite: car_battery_img }
